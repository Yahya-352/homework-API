services:
  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/Todo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: yahya123

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: Todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yahya123
    ports:
      - "5432:5432"